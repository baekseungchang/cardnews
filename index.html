<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14171C">
<title>데일리 카드뉴스</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 화면 3단계: 날짜 폴더 목록 → 그날의 세트 → 세트 상세(카드 전체 + 저장) */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --fg:#14171C; --muted:#5E6673; --line:#D9DDE3;
  --up:#D8342B; --down:#2A62D6; --neutral:#C98A00; --accent:#14171C; --on-accent:#FFFFFF;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1114; --surface:#181B20; --fg:#ECEEF1; --muted:#8C94A0; --line:#2A2F37;
  --up:#FF5A4F; --down:#5B8CFF; --neutral:#F0B323; --accent:#ECEEF1; --on-accent:#0F1114; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;letter-spacing:-0.01em;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.top h1{font-size:19px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:none;color:var(--fg);font:inherit;font-size:22px;line-height:1;padding:4px 8px 4px 0;cursor:pointer}
.back[hidden]{display:none}
.sub{font-family:var(--mono);font-size:11px;color:var(--muted)}
.view{max-width:600px;margin:0 auto;padding:16px}
.msg{color:var(--muted);text-align:center;padding:48px 0}

/* 날짜 폴더 */
.days{display:flex;flex-direction:column;gap:10px}
.day{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-decoration:none;color:inherit}
.fold{flex:none;width:58px;text-align:center}
.fold .m{font-size:12px;color:var(--muted)}
.fold .d{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1}
.fold .w{font-size:12px;color:var(--muted)}
.dayinfo{flex:1;min-width:0}
.dayinfo b{display:block;font-size:14px}
.dayinfo > span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumbs{display:flex;gap:4px;flex:none}
.thumbs img{width:34px;height:42px;object-fit:cover;border-radius:4px;background:var(--line)}
.day.new{border-color:var(--fg)}
.newdot{display:inline-block;font-size:10px;font-weight:700;background:var(--up);color:#fff;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}

/* 하루 세트 */
.sets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.set{text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px;min-width:0}
.set img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;background:var(--line)}
.meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);min-width:0}
.tag{font-weight:700;padding:1px 6px;border-radius:4px;color:#fff;white-space:nowrap}
.tag.up{background:var(--up)} .tag.down{background:var(--down)} .tag.neutral{background:var(--neutral);color:#1a1400}
.tk{font-family:var(--mono);font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set .hl{font-size:13px;font-weight:600;line-height:1.35;margin:0}

/* 세트 상세 */
.head{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.head h2{font-size:19px;line-height:1.35;margin:0;text-wrap:balance}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:14px;font-weight:600;padding:10px 14px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn:disabled{opacity:.5}
.cards{display:flex;flex-direction:column;gap:14px}
.card{position:relative}
.card img{width:100%;border-radius:8px;display:block;background:var(--line);aspect-ratio:4/5}
.card .save{position:absolute;right:10px;bottom:10px;border:0;border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;background:rgba(0,0,0,.62);color:#fff;cursor:pointer;backdrop-filter:blur(6px)}
.card .no{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:2px 8px}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
summary{padding:12px 14px;font-weight:600;font-size:14px;cursor:pointer}
.caption{white-space:pre-wrap;padding:0 14px 14px;font-size:13px;line-height:1.65;user-select:text;overflow-wrap:anywhere}
.btn:focus-visible,.day:focus-visible,.set:focus-visible{outline:2px solid var(--down);outline-offset:2px}
.install{max-width:600px;margin:12px auto 0;padding:0 16px}
.install div{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.install p{margin:0;flex:1;font-size:13px;line-height:1.45}
.install b{display:block;font-size:14px}
.install[hidden]{display:none}
/* 하단 탭 */
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs a{flex:1;text-align:center;padding:12px 0 14px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:700}
.tabs a b{display:block;font-size:18px;line-height:1.1;margin-bottom:2px;font-family:var(--mono)}
.tabs a[aria-current="page"]{color:var(--fg)}
.tabs a[aria-current="page"] b{color:var(--up)}

/* 환율 탭 */
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec:first-child{margin-top:4px}
.sec small{font-weight:500;font-family:var(--mono);font-size:11px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.hero .nm{font-size:13px;color:var(--muted);font-weight:600}
.hero .px{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.hero .px small{font-size:15px;color:var(--muted);margin-left:2px}
.chg{font-family:var(--mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.flat{color:var(--muted)}
.hero svg{display:block;width:100%;height:64px;margin:10px 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:11px;color:var(--muted)}
.stats b{display:block;font-family:var(--mono);font-size:13px;color:var(--fg);font-weight:600}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:10px}
.row{display:grid;grid-template-columns:1fr 72px auto;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .nm b{display:block;font-size:14px}
.row .nm span{font-size:11px;color:var(--muted)}
.row svg{width:72px;height:28px;display:block}
.row .r{text-align:right}
.row .r b{display:block;font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.ol{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:10px}
.ol h3{font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap}
.chip.up{background:var(--up)} .chip.down{background:var(--down)} .chip.neutral{background:var(--neutral);color:#1a1400}
.conf{font-size:11px;color:var(--muted);font-weight:600}
.ol p{margin:8px 0 0;font-size:14px;line-height:1.6}
.band{margin:14px 0 6px}
.band .bar{position:relative;height:8px;border-radius:999px;background:linear-gradient(90deg,var(--down),var(--line) 50%,var(--up));opacity:.85}
.band .pin{position:absolute;top:-5px;width:4px;height:18px;border-radius:2px;background:var(--fg);transform:translateX(-50%)}
.band .lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px}
.band .lbl b{color:var(--fg)}
.sub2{font-size:12px;font-weight:700;color:var(--muted);margin:16px 0 6px}
.drv{list-style:none;margin:0;padding:0}
.drv li{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.5}
.drv li:first-child{border-top:0}
.drv .e{font-size:11px;font-weight:700;padding-top:2px}
.drv .e.up{color:var(--up)} .drv .e.down{color:var(--down)}
.drv a{color:var(--muted);font-size:11px;text-decoration:none;display:block}
.sc{display:grid;gap:6px}
.sc div{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--bg)}
.sc b{font-size:12px}
.sc b.up{color:var(--up)} .sc b.down{color:var(--down)} .sc b.neutral{color:var(--muted)}
.sc span{color:var(--muted);font-size:12px}
.sc em{font-style:normal;font-family:var(--mono);font-size:12px;font-weight:600;white-space:nowrap}
.ev{list-style:none;margin:0;padding:0}
.ev li{display:grid;grid-template-columns:118px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.ev li:first-child{border-top:0}
.ev b{font-family:var(--mono);font-size:12px}
/* 종목 분석 탭 */
.ask{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.ask label{font-size:13px;font-weight:700;display:block;margin-bottom:8px}
.ask .f{display:flex;gap:8px}
.ask input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.ask input:focus-visible{outline:2px solid var(--down);outline-offset:1px}
.ask p{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.55}
.alist{display:flex;flex-direction:column;gap:8px}
.aitem{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-decoration:none;color:inherit}
.aitem .nm b{display:block;font-size:15px}
.aitem .nm span{font-size:12px;color:var(--muted)}
.aitem .when{font-size:11px;color:var(--muted);font-family:var(--mono);text-align:right}
.ring{width:52px;height:52px;position:relative}
.ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:15px;font-weight:600}
.pend{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--neutral);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
.rhead{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.rhead .top2{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.rhead h2{margin:0;font-size:20px;line-height:1.3}
.rhead .meta2{font-size:12px;color:var(--muted);margin-top:2px}
.rhead .px{font-family:var(--mono);font-size:24px;font-weight:600;margin-top:10px;font-variant-numeric:tabular-nums}
.rhead svg.ch{display:block;width:100%;height:70px;margin-top:8px}
.verdict{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.verdict .ring,.verdict .ring svg{width:84px;height:84px}
.verdict .ring b{font-size:24px}
.verdict p{margin:6px 0 0;font-size:14px;line-height:1.6}
.sbars{display:flex;flex-direction:column;gap:10px}
.sbar{display:grid;grid-template-columns:76px 1fr 22px;gap:10px;align-items:center;font-size:13px}
.sbar .tr{height:8px;border-radius:999px;background:var(--bg);overflow:hidden}
.sbar .tr i{display:block;height:100%;border-radius:999px;background:var(--fg)}
.sbar b{font-family:var(--mono);text-align:right}
.sbar small{grid-column:2 / 4;color:var(--muted);font-size:12px;margin-top:-6px;line-height:1.5}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fgrid div{background:var(--bg);border-radius:8px;padding:10px;min-width:0}
.fgrid span{display:block;font-size:11px;color:var(--muted)}
.fgrid b{display:block;font-family:var(--mono);font-size:16px;margin:2px 0}
.fgrid small{display:block;font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:1fr;gap:10px}
.two ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6}
.two h4{margin:0 0 6px;font-size:13px}
.two .b h4{color:var(--up)} .two .r h4{color:var(--down)}
.tl2{list-style:none;margin:0;padding:0}
.tl2 li{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.5}
.tl2 li:first-child{border-top:0}
.tl2 b{font-family:var(--mono);font-size:12px}
.tl2 small{display:block;color:var(--muted);font-size:11px}
.evt{width:100%;border-collapse:collapse;font-size:12px}
.evt td,.evt th{padding:7px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.evt th{color:var(--muted);font-weight:600;border-top:0}
.tablewrap{overflow-x:auto}
.refresh{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;max-width:calc(100% - 32px);z-index:10}
.toast[hidden]{display:none}
</style>
</head>
<body>
<header class="top">
  <button class="back" id="back" type="button" aria-label="뒤로" hidden>‹</button>
  <h1 id="title">데일리 카드뉴스</h1>
  <span class="sub" id="sub"></span>
</header>
<section class="install" id="install" hidden><div><p><b id="instT"></b><span id="instD"></span></p><button class="btn primary" id="instB" type="button"></button></div></section>
<main class="view" id="view"><p class="msg">불러오는 중…</p></main>
<div class="toast" id="toast" role="status" hidden></div>
<nav class="tabs" aria-label="메뉴">
  <a href="#/" id="tabCards"><b>▤</b>카드뉴스</a>
  <a href="#/fx" id="tabFx"><b>₩</b>환율</a>
  <a href="#/news" id="tabNews"><b>◉</b>뉴스</a>
  <a href="#/an" id="tabAn"><b>◎</b>종목 분석</a>
</nav>

<script>
const WD = ['일','월','화','수','목','금','토'];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
let DATA = null, toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2200); }
const dt = (s) => new Date(s + 'T00:00:00');
const label = (s) => { const d = dt(s); return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

async function load(){
  try {
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    DATA = await r.json();
  } catch {
    const c = await caches.match('data.json').catch(() => null);
    if (c) DATA = await c.json();
  }
  route();
}

function setTop(title, back, sub = ''){ $('#title').textContent = title; $('#back').hidden = !back; $('#sub').textContent = sub; }

function route(){
  const view = $('#view');
  const [date, setId] = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const onFx = date === 'fx', onAn = date === 'an', onNews = date === 'news';
  $('#tabFx').setAttribute('aria-current', onFx ? 'page' : 'false');
  $('#tabAn').setAttribute('aria-current', onAn ? 'page' : 'false');
  $('#tabNews').setAttribute('aria-current', onNews ? 'page' : 'false');
  $('#tabCards').setAttribute('aria-current', onFx || onAn || onNews ? 'false' : 'page');
  if (onNews) { window.scrollTo(0, 0); clearInterval(fxTimer); clearInterval(anTimer); return renderNews(view); }
  window.scrollTo(0, 0);
  clearInterval(fxTimer);
  clearInterval(anTimer);
  if (onFx) return renderFx(view);
  if (onAn) return setId ? renderReport(view, decodeURIComponent(setId)) : renderAnalysis(view);
  if (!DATA) { view.innerHTML = '<p class="msg">카드뉴스를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p>'; return; }
  if (!date) return renderDays(view);
  const day = DATA.days.find(d => d.date === date);
  if (!day) { location.hash = ''; return; }
  if (!setId) return renderDay(view, day);
  const set = day.sets.find(s => s.dir === setId);
  if (!set) { location.hash = '#/' + date; return; }
  renderSet(view, day, set);
}

function renderDays(view){
  setTop('데일리 카드뉴스', false, DATA.updated ? `업데이트 ${DATA.updated}` : '');
  if (!DATA.days.length) { view.innerHTML = '<p class="msg">아직 카드뉴스가 없어요. 평일 아침 8시에 새 폴더가 생겨요.</p>'; return; }
  const today = todayStr();
  view.innerHTML = `<div class="days">${DATA.days.map(d => { const x = dt(d.date); return `
    <a class="day${d.date === today ? ' new' : ''}" href="#/${d.date}">
      <div class="fold"><div class="m">${x.getMonth()+1}월</div><div class="d">${x.getDate()}</div><div class="w">${WD[x.getDay()]}요일</div></div>
      <div class="dayinfo"><b>${d.sets.length}개 카드뉴스${d.date === today ? '<span class="newdot">오늘</span>' : ''}</b><span>${d.sets.map(s => esc(s.ticker)).join(' · ')}</span></div>
      <div class="thumbs">${d.sets.slice(0,3).map(s => `<img src="${s.images[0]}" alt="" loading="lazy">`).join('')}</div>
    </a>`; }).join('')}</div>`;
}

function renderDay(view, day){
  setTop(label(day.date), true);
  view.innerHTML = `<div class="sets">${day.sets.map(s => `
    <a class="set" href="#/${day.date}/${s.dir}">
      <img src="${s.images[0]}" alt="${esc(s.ticker)} 표지" loading="lazy">
      <div class="meta"><span class="tag ${s.direction}">${esc(s.tag)}</span><span class="tk">${esc(s.ticker)}</span></div>
      <p class="hl">${esc(s.headline)}</p>
    </a>`).join('')}</div>`;
}

function fileName(day, set, i){ return `${day.date}_${set.id}_${String(i+1).padStart(2,'0')}.jpg`; }

async function saveImage(src, name){
  const blob = await (await fetch(src)).blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

      if (r.status === 201) { $('#igConfirm').hidden = true; toast('인스타에 올리는 중이에요. 1~2분 걸려요'); setTimeout(showIg, 1500); setTimeout(showIg, 60000); setTimeout(showIg, 120000); }
      else toast(r.status === 401 ? '키가 만료됐어요. 키를 다시 저장해 주세요' : `요청 실패 (${r.status})`);

// ---------- 환율 탭 ----------
let fxTimer = null;
const fmt = (v, d) => Number(v).toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d });
const dirOf = (v) => (v > 0 ? 'up' : v < 0 ? 'down' : 'flat');
const signed = (v, d = 2) => (v == null ? '-' : `${v > 0 ? '+' : ''}${fmt(v, d)}`);
const kst = (iso) => { const d = new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };

function spark(vals, w, h, color){
  if (!vals || vals.length < 2) return '';
  const min = Math.min(...vals), max = Math.max(...vals), pad = (max - min) * 0.1 || 1;
  const x = (i) => (i / (vals.length - 1)) * w, y = (v) => h - ((v - min + pad) / (max - min + pad * 2)) * h;
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}L${w},${h}L0,${h}Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
const colorOf = (dir) => getComputedStyle(document.documentElement).getPropertyValue(dir === 'up' ? '--up' : dir === 'down' ? '--down' : '--muted').trim();

async function getJSON(url){
  try { const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) return await r.json(); } catch {}
  const c = await caches.match(url, { ignoreSearch: true }).catch(() => null);
  return c ? c.json() : null;
}

// 실시간 환율 (몇 분 지연, 브라우저에서 바로 호출 가능한 공개 API)
const RT_MAP = { USDKRW: { name: 'USDKRW=X', mult: 1 }, JPYKRW: { name: 'JPYKRW=X', mult: 100 }, EURKRW: { name: 'EURKRW=X', mult: 1 }, USDJPY: { name: 'USDJPY=X', mult: 1 } };
async function realtime(){
  const get = async (u) => {
    const c = new AbortController(), t = setTimeout(() => c.abort(), 6000);
    try { const r = await fetch(u, { cache: 'no-store', signal: c.signal }); return r.ok ? await r.json() : []; } catch { return []; } finally { clearTimeout(t); }
  };
  const [a, b] = await Promise.all([get('https://api.manana.kr/exchange/rate/KRW/USD,JPY,EUR.json'), get('https://api.manana.kr/exchange/rate/JPY/USD.json')]);
  const map = {};
  [...(Array.isArray(a) ? a : []), ...(Array.isArray(b) ? b : [])].forEach((x) => { if (x && x.name && x.rate) map[x.name] = x; });
  return map;
}

async function renderFx(view){
  clearInterval(fxTimer);
  setTop('환율', false);
  if (!view.querySelector('.fxwrap')) view.innerHTML = '<p class="msg">환율을 불러오는 중…</p>';
  const [live, ol, rt, track] = await Promise.all([getJSON('live/fx.json'), getJSON('outlook/fx.json'), realtime(), getJSON('knowledge/fx-track.json')]);
  if (!location.hash.startsWith('#/fx')) return;
  const items = live?.items || [];
  // 실시간 시세로 현재가를 덮어쓴다 (차트·기간 변화는 GitHub 데이터 사용)
  let rtTime = null;
  for (const it of items) {
    const m = RT_MAP[it.code], x = m && rt[m.name];
    if (!x || !it.prev) continue;
    const p = 10 ** it.digits, v = Math.round(x.rate * m.mult * p) / p;
    if (Math.abs(v / it.last - 1) > 0.05) continue; // 이상값은 무시
    it.last = v;
    it.chg = Math.round((v - it.prev) * p) / p;
    it.chgPct = Math.round(((v - it.prev) / it.prev) * 10000) / 100;
    if (it.intraday?.length) it.intraday = [...it.intraday, v];
    rtTime = x.date;
  }
  const by = Object.fromEntries(items.map((i) => [i.code, i]));
  const ageMin = live ? (Date.now() - new Date(live.updated)) / 60000 : Infinity;
  const usd = by.USDKRW;

  let html = '<div class="fxwrap">';
  html += `<div class="sec"><span>실시간 환율</span><button class="refresh" id="fxRefresh" type="button">새로고침</button></div>`;
  if (usd) {
    const d = dirOf(usd.chg);
    html += `<div class="hero">
      <div class="nm">원/달러 · ${esc(usd.label)}</div>
      <div class="px">${fmt(usd.last, 1)}<small>원</small></div>
      <div class="chg ${d}">${signed(usd.chg, 1)}원 (${signed(usd.chgPct)}%) <span style="color:var(--muted);font-weight:500">전일 대비</span></div>
      ${spark(usd.intraday, 300, 64, colorOf(d))}
      <div class="stats"><div>1주<b class="chg ${dirOf(usd.chg1w)}">${signed(usd.chg1w)}%</b></div><div>1개월<b class="chg ${dirOf(usd.chg1m)}">${signed(usd.chg1m)}%</b></div><div>1개월 고/저<b>${fmt(usd.high1m, 0)} / ${fmt(usd.low1m, 0)}</b></div></div>
    </div>`;
  }
  const rest = items.filter((i) => i.code !== 'USDKRW');
  if (rest.length) {
    html += '<div class="rows">' + rest.map((i) => { const d = dirOf(i.chg); return `
      <div class="row"><div class="nm"><b>${esc(i.name)}</b><span>${esc(i.label)}${i.unit ? ' · ' + esc(i.unit) : ''}</span></div>
      ${spark(i.intraday, 72, 28, colorOf(d))}
      <div class="r"><b>${fmt(i.last, i.digits)}</b><span class="chg ${d}">${signed(i.chgPct)}%</span></div></div>`; }).join('') + '</div>';
  }
  html += `<p class="note">${rtTime ? `실시간 시세 ${esc(String(rtTime).slice(5, 16))} (1분마다 갱신, 몇 분 지연될 수 있음) · 차트·기간 변화는 ${kst(live.updated)} 기준.` : live ? `시세 기준 ${kst(live.updated)}.` : '시세를 불러오지 못했어요.'}${ageMin > 120 ? ' · 주말·휴장 중에는 마지막 시세가 보여요.' : ''} 실제 은행 환전 가격과는 차이가 있어요.</p>`;

  if (ol) {
    html += `<div class="sec"><span>환율 전망</span><small>분석 ${kst(ol.updated)} · 하루 3번</small></div>`;
    html += `<div class="ol"><h3>${esc(ol.headline)}</h3><p>${esc(ol.summary)}</p></div>`;
    // 전망 성적표: 1주가 지나면 실제 시세로 자동 채점
    const st = track?.stats;
    if (st) {
      const pc = (a, n) => (n ? `${a}/${n} (${Math.round((a / n) * 100)}%)` : '-');
      const names = { USDKRW: '원/달러', JPYKRW: '원/100엔', EURKRW: '원/유로' };
      html += `<div class="ol"><h3>전망 성적표 <span class="conf">1주 뒤 실제 시세로 자동 채점</span></h3>${st.all?.n
        ? `<div class="stats" style="margin-top:10px"><div>채점한 전망<b>${st.all.n}건</b></div><div>범위 적중<b>${pc(st.all.range, st.all.n)}</b></div><div>방향 적중<b>${pc(st.all.dir, st.all.n)}</b></div></div>
           <p class="note">${Object.entries(st.byCode || {}).filter(([, v]) => v.n).map(([k, v]) => `${names[k] || k} 범위 ${pc(v.range, v.n)} · 방향 ${pc(v.dir, v.n)}`).join('<br>')}</p>`
        : `<p>아직 채점할 전망이 없어요. 첫 채점은 <b>${st.nextDue ? `${Number(st.nextDue.slice(5, 7))}/${Number(st.nextDue.slice(8))}` : '1주 뒤'}</b>에 나와요. 빗나간 전망은 다음 분석에 반영돼요.</p>`}</div>`;
    }
    for (const p of ol.pairs || []) {
      const now = by[p.code]?.last ?? p.base;
      const [lo, hi] = p.range;
      const pos = Math.max(0, Math.min(100, ((now - lo) / (hi - lo)) * 100));
      html += `<div class="ol">
        <h3>${esc(p.name)} <span class="chip ${p.view}">${esc(p.viewText)}</span> <span class="conf">확신도 ${esc(p.confidence)}</span></h3>
        <div class="band"><div class="bar"><span class="pin" style="left:${pos}%"></span></div>
          <div class="lbl"><span>${fmt(lo, 0)}</span><span>지금 <b>${fmt(now, p.code === 'JPYKRW' ? 1 : 1)}</b> · ${esc(p.rangeNote)}</span><span>${fmt(hi, 0)}</span></div></div>
        <p>${esc(p.summary)}</p>
        <div class="sub2">근거 (기사·데이터)</div>
        <ul class="drv">${p.drivers.map((d) => `<li><span class="e ${d.effect}">${d.effect === 'up' ? '▲ 상승요인' : '▼ 하락요인'}</span><span>${esc(d.text)}${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.src)} ↗</a>` : `<a>${esc(d.src)}</a>`}</span></li>`).join('')}</ul>
        <div class="sub2">시나리오</div>
        <div class="sc">${p.scenarios.map((s) => `<div><b class="${s.dir}">${esc(s.name)}</b><span>${esc(s.cond)}</span><em>${esc(s.range)}</em></div>`).join('')}</div>
      </div>`;
    }
    if (ol.events?.length) html += `<div class="sec"><span>앞으로의 일정</span></div><div class="ol"><ul class="ev">${ol.events.map((e) => `<li><b>${esc(e.date)}</b><span>${esc(e.text)}</span></li>`).join('')}</ul></div>`;
    html += `<p class="note">${esc(ol.method || '')}${(ol.excluded || []).length ? '<br>제외: ' + ol.excluded.map(esc).join(' / ') : ''}<br>전망은 참고용이며 투자 판단의 책임은 본인에게 있어요.</p>`;
  }
  html += '</div>';
  view.innerHTML = html;
  $('#fxRefresh').onclick = () => { toast('새로 불러오는 중'); renderFx(view); };
  fxTimer = setInterval(() => { if (document.visibilityState === 'visible' && location.hash.startsWith('#/fx')) renderFx(view); }, 60000);
}

  const fileOf = Object.fromEntries((idx?.items || []).map((a) => [a.symbol, a.file.replace(/\.json$/, '')]));
  let html = `<div class="newswrap"><div class="sec"><span>시장을 움직일 뉴스</span><small>${feed?.updated ? `확인 ${kst(feed.updated)} · 3시간마다` : '3시간마다 확인'}</small></div>`;

  let lastDay = '';
  for (const n of items) {

    if (day !== lastDay) { html += `<div class="sec"><span>${day}</span></div>`; lastDay = day; }
    html += `<div class="ol news">
      <div class="meta"><span class="chip neutral" style="background:var(--line);color:var(--fg)">${esc(n.category || '')}</span><span>${n.time ? esc(n.time.slice(11, 16)) : ''}</span>${n.confidence === '주의' ? '<span class="chip down">확인 중</span>' : ''}</div>
      <h3 style="margin-top:8px">${esc(n.title)}</h3>
      <p>${esc(n.summary)}</p>
      ${n.why ? `<p class="note" style="color:var(--fg)">왜 중요한가: ${esc(n.why)}</p>` : ''}
      ${n.impact ? `<p style="font-size:13px"><b class="chg ${n.impact.dir === 'up' ? 'up' : n.impact.dir === 'down' ? 'down' : 'flat'}">${dirTxt[n.impact.dir] || ''}</b> ${esc(n.impact.text || '')}</p>` : ''}
      ${(n.tickers || []).length ? `<div class="meta" style="margin-top:8px;flex-wrap:wrap">${n.tickers.map((t) => analyzed.has(t) ? `<a class="chip neutral" style="text-decoration:none" href="#/an/${encodeURIComponent(fileOf[t])}">${esc(t)} 분석 보기</a>` : `<span class="tk">${esc(t)}</span>`).join('')}</div>` : ''}
      ${(n.sources || []).length ? `<p class="note">${n.sources.map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:var(--muted)">${esc(s.name)} ↗</a>`).join(' · ')}</p>` : ''}
    </div>`;
  }
  html += `<p class="note">출처 2곳 이상에서 확인한 뉴스만 올려요. 1곳뿐인 소식은 '확인 중'으로 표시해요. 투자 권유가 아니에요.</p></div>`;
  view.innerHTML = html;
}

// ---------- 종목 분석 탭 ----------
let anTimer = null;
const REPO = 'baekseungchang/cardnews';
const stanceCls = (s) => (s === 'positive' ? 'up' : s === 'negative' ? 'down' : 'neutral');
const ago = (iso) => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 60 ? `${m}분 전` : m < 1440 ? `${Math.round(m / 60)}시간 전` : `${Math.round(m / 1440)}일 전`; };
function ring(score, stance, size = 52){
  const r = size / 2 - 5, c = 2 * Math.PI * r, v = Math.max(0, Math.min(100, score || 0));
  const col = colorOf(stance === 'positive' ? 'up' : stance === 'negative' ? 'down' : '');
  return `<div class="ring"><svg viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${stance === 'neutral' ? getComputedStyle(document.documentElement).getPropertyValue('--neutral').trim() : col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(c * v / 100).toFixed(1)} ${c.toFixed(1)}"/></svg><b>${score ?? '-'}</b></div>`;
}
async function openIssues(){
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/issues?state=open&creator=baekseungchang&per_page=30&t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) return null;
    return (await r.json()).filter((i) => !i.pull_request && /^\[분석\]/.test(i.title));
  } catch { return null; }
}

// GitHub 키는 이 휴대폰(브라우저 저장소)에만 둔다
const getTok = () => { try { return localStorage.getItem('ghToken') || ''; } catch { return ''; } };
const setTok = (v) => { try { v ? localStorage.setItem('ghToken', v) : localStorage.removeItem('ghToken'); } catch {} };

async function renderAnalysis(view){
  clearInterval(anTimer);
  setTop('종목 분석', false);
  const keep = view.querySelector('#anQ')?.value || '';
  if (!view.querySelector('.anwrap')) view.innerHTML = '<p class="msg">불러오는 중…</p>';
  const [idx, pending, atrack, feed] = await Promise.all([getJSON('analysis/index.json'), openIssues(), getJSON('knowledge/analysis-track.json'), getJSON('news/feed.json')]);
  // 분석 이후 새로 나온 관련 뉴스 수
  const newsAfter = (sym, since) => (feed?.items || []).filter((n) => (n.tickers || []).includes(sym) && n.time > since).length;
  if (!location.hash.startsWith('#/an') || location.hash.split('/').length > 2) return;
  const items = idx?.items || [];
  const tok = getTok();
  let html = `<div class="anwrap">
    <form class="ask" id="anForm">
      <label for="anQ">분석할 종목</label>
      <div class="f"><input id="anQ" name="q" autocomplete="off" placeholder="예: TSLA, 엔비디아, 삼성전자" value="${esc(keep)}"><button class="btn primary" id="anGo" type="submit">분석 시작</button></div>
      <p>${tok ? '입력하고 <b>분석 시작</b>만 누르면 돼요. 뉴스·재무·주가 데이터를 교차검증해서 보통 15~30분 뒤 이 화면에 보고서가 올라와요.' : '자동 분석 키를 저장하면 입력만으로 바로 분석이 시작돼요. 아래 안내를 봐 주세요.'}</p>
    </form>
    <details class="ol" id="tokBox" style="padding:0" ${tok ? '' : 'open'}>
      <summary>${tok ? '자동 분석 켜짐 · 연결 관리' : '자동 분석 켜기 (처음 한 번, 약 2분)'}</summary>
      <div style="padding:0 16px 16px">
        ${tok ? `<p class="note" style="margin-top:0">이 휴대폰에 GitHub 키가 저장돼 있어요. 키는 이 휴대폰에만 있고 다른 곳으로 보내지 않아요.</p><button class="btn" id="tokDel" type="button">키 삭제</button>` : `
        <p class="note" style="margin-top:0;color:var(--fg)">자동 분석 키가 없어요. PC에서 Claude에게 <b>"분석 키 다시 만들어줘"</b>라고 말하면 키 만드는 화면을 열어 드려요. 만든 키를 아래 칸에 붙여넣고 저장하면 돼요.</p>
        <div class="f" style="display:flex;gap:8px"><input id="tokIn" type="password" autocomplete="off" placeholder="github_pat_로 시작하는 키" style="flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)"><button class="btn primary" id="tokSave" type="button">저장</button></div>
        <p class="note">키는 이 휴대폰에만 저장되고, 분석 요청을 보낼 때만 GitHub에 사용돼요. 이 저장소의 '요청(Issues)' 권한만 있어서 다른 데는 쓸 수 없어요.</p>`}
      </div>
    </details>`;
  const ts = atrack?.stats;
  if (ts) html += `<div class="ol"><h3>분석 성적표 <span class="conf">30일 뒤 실제 주가로 자동 채점 (시장 지수 대비)</span></h3>${ts.n ? `<div class="stats" style="margin-top:10px"><div>채점한 분석<b>${ts.n}건</b></div><div>판단 적중<b>${ts.hit}/${ts.n} (${Math.round(ts.hit / ts.n * 100)}%)</b></div><div>채점 대기<b>${ts.pending}건</b></div></div>` : `<p>아직 채점한 분석이 없어요. 첫 채점은 <b>${ts.nextDue ? `${Number(ts.nextDue.slice(5, 7))}/${Number(ts.nextDue.slice(8))}` : '30일 뒤'}</b>에 나와요. 긍정은 시장보다 올랐는지, 부정은 시장보다 내렸는지, 중립은 시장과 ±5% 안이었는지로 채점해요.</p>`}</div>`;
  if (pending === null) html += `<p class="note">요청 현황을 불러오지 못했어요. 잠시 후 다시 열어 주세요.</p>`;
  if (pending?.length) {
    html += `<div class="sec"><span>분석 중</span></div><div class="alist">` + pending.map((i) => `
      <div class="pend"><span class="dot"></span><span><b>${esc(i.title.replace(/^\[분석\]\s*/, ''))}</b> · ${ago(i.created_at)} 요청</span></div>`).join('') + '</div>';
  }
  html += `<div class="sec"><span>완료된 분석</span><small>${items.length}개</small></div>`;
  html += items.length ? '<div class="alist">' + items.map((a) => `
    <a class="aitem" href="#/an/${encodeURIComponent(a.file.replace(/\.json$/, ''))}">
      ${a.notFound ? '<div class="ring"><b>?</b></div>' : ring(a.score, a.stance)}
      <div class="nm"><b>${esc(a.name || a.query)}</b><span>${a.notFound ? '종목을 찾지 못했어요' : `${esc(a.symbol)} · <span class="chip ${stanceCls(a.stance)}">${esc(a.stanceText || '')}</span>`}</span></div>
      <div class="when">${a.updated ? kst(a.updated) : ''}${!a.notFound && newsAfter(a.symbol, a.updated) ? `<br><span class="chip up">새 소식 ${newsAfter(a.symbol, a.updated)}</span>` : ''}</div>
    </a>`).join('') + '</div>' : '<p class="msg">아직 분석한 종목이 없어요. 위에서 종목을 입력해 보세요.</p>';
  html += `<p class="note">AI가 공개 자료를 모아 만든 참고용 분석이에요. 매수·매도 권유가 아니며, 투자 판단과 책임은 본인에게 있어요.</p></div>`;
  view.innerHTML = html;
  $('#anForm').onsubmit = async (e) => {
    e.preventDefault();
    const q = $('#anQ').value.trim();
    if (!q) { $('#anQ').focus(); return; }
    const title = '[분석] ' + q, body = '앱에서 보낸 종목 분석 요청이에요.';
    const t = getTok();
    if (!t) { $('#tokBox').open = true; toast('자동 분석 키가 필요해요. 아래 안내를 봐 주세요'); return; }
    const b = $('#anGo'); b.disabled = true; b.textContent = '보내는 중…';
    try {
      const r = await fetch(`https://api.github.com/repos/${REPO}/issues`, { method: 'POST', headers: { Authorization: `Bearer ${t}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify({ title, body }) });
      if (r.status === 201) { toast('분석을 시작했어요. 15~30분 뒤 여기 올라와요'); $('#anQ').value = ''; setTimeout(() => renderAnalysis(view), 1500); return; }
      if (r.status === 401) toast('키가 만료됐거나 잘못됐어요. 키를 다시 저장해 주세요');
      else if (r.status === 403 || r.status === 404) toast('키에 Issues 쓰기 권한이 없어요. 키 설정을 확인해 주세요');
      else toast(`요청 실패 (${r.status}). 잠시 후 다시 해 주세요`);
    } catch { toast('인터넷 연결을 확인해 주세요'); }
    b.disabled = false; b.textContent = '분석 시작';
  };
  $('#tokSave') && ($('#tokSave').onclick = async () => {
    const v = $('#tokIn').value.trim();
    if (!/^(github_pat_|ghp_)/.test(v)) { toast('github_pat_로 시작하는 키를 붙여넣어 주세요'); return; }
    try {
      const r = await fetch(`https://api.github.com/repos/${REPO}`, { headers: { Authorization: `Bearer ${v}`, Accept: 'application/vnd.github+json' } });
      if (!r.ok) { toast('키를 확인하지 못했어요. 다시 복사해 주세요'); return; }
    } catch { toast('인터넷 연결을 확인해 주세요'); return; }
    setTok(v); toast('자동 분석을 켰어요'); renderAnalysis(view);
  });
  $('#tokDel') && ($('#tokDel').onclick = () => { setTok(''); toast('키를 지웠어요'); renderAnalysis(view); });
  // 입력 중일 때는 화면을 새로 그리지 않는다
  anTimer = setInterval(() => { if (document.visibilityState === 'visible' && location.hash === '#/an' && !document.activeElement?.matches('input') && !$('#tokIn')?.value) renderAnalysis(view); }, 60000);
}

async function renderReport(view, file){
  setTop('종목 분석', true);
  view.innerHTML = '<p class="msg">보고서를 불러오는 중…</p>';
  const a = await getJSON(`analysis/${file}.json`);
  if (!a) { view.innerHTML = '<p class="msg">보고서를 불러오지 못했어요.</p>'; return; }
  if (a.notFound) {
    setTop(a.query || '종목 분석', true);
    view.innerHTML = `<div class="ol"><h3>종목을 찾지 못했어요</h3><p>${esc(a.message || '')}</p></div>`;
    return;
  }
  setTop(a.name, true, a.symbol);
  const p = a.price || {}, s = a.assessment || {};
  const cur = a.currency === 'KRW' ? '원' : a.currency === 'USD' ? '$' : (a.currency || '');
  const money = (v) => (v == null ? '-' : a.currency === 'USD' ? `$${fmt(v, 2)}` : `${fmt(v, a.currency === 'KRW' ? 0 : 2)}${cur}`);
  const pc = (v) => (v == null ? '-' : `<span class="chg ${dirOf(v)}">${signed(v, 1)}%</span>`);
  const dirCol = colorOf(dirOf(p.chg1y ?? 0));
  let html = `<div class="rhead">
    <div class="top2"><div><h2>${esc(a.name)}</h2><div class="meta2">${esc(a.symbol)} · ${esc(a.market || '')} · ${esc(a.sector || '')}</div></div><div class="meta2" style="text-align:right">분석<br>${a.updated ? kst(a.updated) : ''}</div></div>
    <div class="px">${money(p.last)} <span class="meta2">${esc(p.asOf || '')}</span></div>
    ${spark(a.chart, 300, 70, dirCol).replace('<svg ', '<svg class="ch" ')}
    <div class="stats"><div>1개월<b>${pc(p.chg1m)}</b></div><div>연초 대비<b>${pc(p.chgYtd)}</b></div>${p.listed ? `<div>상장 이후 (${Number(p.listed.slice(5, 7))}/${Number(p.listed.slice(8))})<b>${pc(p.sinceListing)}</b></div>` : `<div>1년<b>${pc(p.chg1y)}</b></div>`}</div>
    <div class="note" style="margin-top:6px">52주 범위 ${money(p.low52)} ~ ${money(p.high52)}</div>
    <div class="verdict">${ring(s.score, s.stance, 84)}<div><span class="chip ${stanceCls(s.stance)}">${esc(s.stanceText || '')}</span> <span class="conf">확신도 ${esc(s.confidence || '-')}</span><p>${esc(s.thesis || '')}</p></div></div>
  </div>`;
  if (a.scores?.length) html += `<div class="sec"><span>점수표</span><small>항목별 1~5점</small></div><div class="ol"><div class="sbars">${a.scores.map((x) => `
      <div class="sbar"><span>${esc(x.name)}</span><span class="tr"><i style="width:${x.score * 20}%"></i></span><b>${x.score}</b><small>${esc(x.reason)}${x.src ? ` · ${esc(x.src)}` : ''}</small></div>`).join('')}</div></div>`;
  if (a.fundamentals?.length) html += `<div class="sec"><span>핵심 지표</span></div><div class="ol"><div class="fgrid">${a.fundamentals.map((f) => `<div><span>${esc(f.label)}</span><b>${esc(f.value)}</b><small>${esc(f.note || '')}${f.src ? ` · ${esc(f.src)}` : ''}</small></div>`).join('')}</div></div>`;
  const tl = (arr) => `<ul class="tl2">${arr.map((e) => `<li><b>${esc(e.date || '')}</b><span>${esc(e.text)}${e.src ? `<small>${esc(e.src)}</small>` : ''}</span></li>`).join('')}</ul>`;
  if (a.past?.length) html += `<div class="sec"><span>과거 · 주요 사건</span></div><div class="ol">${tl(a.past)}</div>`;
  if (a.present?.length) html += `<div class="sec"><span>현재 · 최근 상황</span></div><div class="ol">${tl(a.present)}</div>`;
  if (a.future?.length) html += `<div class="sec"><span>미래 · 앞으로의 일정</span></div><div class="ol">${tl(a.future)}${a.analysts?.text ? `<p class="note">애널리스트: ${esc(a.analysts.text)}${a.analysts.src ? ` (${esc(a.analysts.src)})` : ''}</p>` : ''}</div>`;
  if (a.bull?.length || a.bear?.length) html += `<div class="sec"><span>강세 논리 vs 약세 논리</span></div><div class="ol two"><div class="b"><h4>▲ 강세 논리</h4><ul>${(a.bull || []).map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div><div class="r"><h4>▼ 약세 논리</h4><ul>${(a.bear || []).map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div></div>`;
  if (a.scenarios?.length) html += `<div class="sec"><span>시나리오</span></div><div class="ol"><div class="sc">${a.scenarios.map((x) => `<div><b class="${x.dir === 'up' ? 'up' : x.dir === 'down' ? 'down' : 'neutral'}">${esc(x.name)}</b><span>${esc(x.cond)}</span><em>${esc(x.result || '')}</em></div>`).join('')}</div></div>`;
  if (a.watch?.length) html += `<div class="sec"><span>판단을 바꿀 체크포인트</span></div><div class="ol"><ul class="tl2">${a.watch.map((w, i) => `<li><b>${i + 1}</b><span>${esc(w)}</span></li>`).join('')}</ul></div>`;
  if (a.evidence?.length) html += `<details class="ol" style="padding:0"><summary>검증 노트 (문장별 근거 ${a.evidence.length}개)</summary><div class="tablewrap" style="padding:0 12px 12px"><table class="evt"><tr><th>내용</th><th>기사 근거</th><th>데이터</th><th>판정</th></tr>${a.evidence.map((e) => `<tr><td>${esc(e.claim)}</td><td>${esc(e.source)}</td><td>${esc(e.data)}</td><td>${esc(e.verdict)}</td></tr>`).join('')}</table>${a.excluded?.length ? `<p class="note">뺀 내용: ${a.excluded.map(esc).join(' / ')}</p>` : ''}</div></details>`;
  if (a.sources?.length) html += `<div class="sec"><span>출처</span></div><div class="ol"><ul class="drv">${a.sources.map((x) => `<li><span class="e">↗</span><span><a href="${esc(x.url)}" target="_blank" rel="noopener" style="font-size:13px;color:var(--fg)">${esc(x.name)}</a></span></li>`).join('')}</ul></div>`;
  html += `<p class="note">이 보고서는 공개 자료를 모아 AI가 정리한 참고용 분석이에요. 매수·매도 권유가 아니며 실제 투자 판단과 책임은 본인에게 있어요.</p>`;
  view.innerHTML = html;
}

$('#back').onclick = () => {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  parts.pop(); location.hash = parts.length ? '#/' + parts.join('/') : '';
};
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
// 설치 안내: 카카오톡 등 앱 안 브라우저면 크롬으로 열기, 크롬이면 설치 버튼
const ua = navigator.userAgent;
const standalone = matchMedia('(display-mode: standalone)').matches;
const inApp = /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(ua);
function showInstall(t, d, b, fn){ $('#instT').textContent = t; $('#instD').textContent = d; $('#instB').textContent = b; $('#instB').onclick = fn; $('#install').hidden = false; }
if (!standalone && inApp && /Android/i.test(ua)) {
  const url = location.href.split('#')[0];
  showInstall('크롬에서 열어야 앱으로 설치돼요', '지금은 카카오톡 안의 브라우저예요.', '크롬으로 열기', () => {
    location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
  });
}
let deferred = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferred = e;
  showInstall('휴대폰에 앱으로 설치하기', '홈 화면과 앱 목록에 아이콘이 생겨요.', '설치', async () => {
    deferred.prompt(); const r = await deferred.userChoice; deferred = null;
    $('#install').hidden = true; if (r.outcome === 'accepted') toast('설치했어요. 앱 목록에서 카드뉴스를 찾아보세요');
  });
});
window.addEventListener('appinstalled', () => { $('#install').hidden = true; });
if (!standalone && !inApp && /Android/i.test(ua)) setTimeout(() => { if (!deferred && $('#install').hidden) showInstall('앱으로 설치하는 방법', '크롬 오른쪽 위 ⋮ 메뉴 → "앱 설치" 또는 "홈 화면에 추가"', '확인', () => { $('#install').hidden = true; }); }, 2500);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
load();
