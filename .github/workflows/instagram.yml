# 앱에서 '인스타에 올리기'를 누르면 생기는 "[게시] 날짜/세트" 요청을 받아 인스타그램에 캐러셀로 게시
name: 인스타 게시

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  post:
    if: startsWith(github.event.issue.title, '[게시]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 인스타에 게시
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TITLE: ${{ github.event.issue.title }}
        run: node _system/post_instagram.js "$(echo "$TITLE" | sed 's/^\[게시\] *//')"
      - name: 결과 알리고 요청 닫기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          msg=$(node -e "try{const r=require('./result.json');console.log((r.ok?'✅ ':'⚠️ ')+r.message+(r.link?'\n'+r.link:''))}catch(e){console.log('⚠️ 게시 중 오류가 났어요')}")
          gh issue comment "$NUM" --body "$msg"
          gh issue close "$NUM"
